<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    color: #1a2332;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 420px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 24px;
    text-align: center;
    color: #0b5fff;
    margin-bottom: 18px;
  }
  .mode-toggle {
    display: flex;
    background: #eef2f7;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .mode-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 600;
    color: #5a6a7d;
    padding: 10px 6px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-toggle button.active {
    background: #0b5fff;
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(11,95,255,0.3);
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #5a6a7d;
    margin-bottom: 6px;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    border: 2px solid #d7e0ea;
    border-radius: 10px;
    margin-bottom: 18px;
    background: #fbfdff;
  }
  .input-wrap:focus-within { border-color: #0b5fff; }
  .prefix {
    padding: 0 4px 0 14px;
    font-size: 20px;
    color: #5a6a7d;
  }
  input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 22px;
    padding: 14px 14px 14px 8px;
    background: transparent;
    color: #1a2332;
    min-width: 0;
  }
  .results { margin-top: 8px; }
  .result-box {
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .result-box .lbl { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .result-box .val { font-size: 30px; font-weight: 700; margin-top: 2px; word-break: break-all; }
  .profit { background: #e8f7ee; }
  .profit .lbl { color: #1c7a3d; }
  .profit .val { color: #146c31; }
  .total { background: #e8f0fe; }
  .total .lbl { color: #0b5fff; }
  .total .val { color: #0b5fff; }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: #8a99ab;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Percentage Calculator</h1>
    <div class="mode-toggle">
      <button id="modeAmount" class="active" type="button">From Amount</button>
      <button id="modeTotal" type="button">From Total</button>
    </div>
    <label for="amount" id="amountLabel">Amount (&#8377;)</label>
    <div class="input-wrap">
      <span class="prefix">&#8377;</span>
      <input id="amount" type="number" inputmode="decimal" placeholder="0" min="0">
    </div>
    <label for="percent">Percent (%)</label>
    <div class="input-wrap">
      <span class="prefix">%</span>
      <input id="percent" type="number" inputmode="decimal" placeholder="0" min="0">
    </div>
    <div class="results">
      <div class="result-box profit">
        <div class="lbl">Profit</div>
        <div class="val" id="profit">&#8377;0</div>
      </div>
      <div class="result-box total">
        <div class="lbl" id="secondLabel">Total (Amount + Profit)</div>
        <div class="val" id="total">&#8377;0</div>
      </div>
    </div>
  </div>
  <footer>BISWAKARMA NET ZONE</footer>
<script>
  var amountEl = document.getElementById('amount');
  var percentEl = document.getElementById('percent');
  var profitEl = document.getElementById('profit');
  var totalEl = document.getElementById('total');
  var amountLabel = document.getElementById('amountLabel');
  var secondLabel = document.getElementById('secondLabel');
  var modeAmountBtn = document.getElementById('modeAmount');
  var modeTotalBtn = document.getElementById('modeTotal');
  var mode = 'amount';
  function fmt(n) {
    if (!isFinite(n)) n = 0;
    var rounded = Math.round(n * 100) / 100;
    return '₹' + rounded.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  function calc() {
    var amount = parseFloat(amountEl.value) || 0;
    var percent = parseFloat(percentEl.value) || 0;
    var profit = amount * percent / 100;
    profitEl.textContent = fmt(profit);
    if (mode === 'total') {
      totalEl.textContent = fmt(amount - profit);
    } else {
      totalEl.textContent = fmt(amount + profit);
    }
  }
  function setMode(m) {
    mode = m;
    if (m === 'total') {
      amountLabel.innerHTML = 'Total (₹)';
      secondLabel.textContent = 'Remaining (Total − Profit)';
      modeTotalBtn.classList.add('active');
      modeAmountBtn.classList.remove('active');
    } else {
      amountLabel.innerHTML = 'Amount (₹)';
      secondLabel.textContent = 'Total (Amount + Profit)';
      modeAmountBtn.classList.add('active');
      modeTotalBtn.classList.remove('active');
    }
    calc();
  }
  modeAmountBtn.addEventListener('click', function() { setMode('amount'); });
  modeTotalBtn.addEventListener('click', function() { setMode('total'); });
  amountEl.addEventListener('input', calc);
  percentEl.addEventListener('input', calc);
  calc();
</script>
</body>
</html>
